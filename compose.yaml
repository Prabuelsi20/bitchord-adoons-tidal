services:
  tidal-addon:
    build: .
    container_name: tidal-only-bitchord
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8101:8100"
    volumes:
      - tidal_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  tidal_data:
